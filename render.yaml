services:
  - type: web
    name: kanban-helios
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: helios-db
          property: connectionString

databases:
  - name: helios-db
    plan: free
    databaseName: helios
    user: helios
