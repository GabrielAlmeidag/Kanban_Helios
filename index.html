<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projeto Helios</title><style>*{box-sizing:border-box}body{margin:0;font:14px Inter,Segoe UI,Arial;background:var(--bg);color:var(--tx);transition:.2s}:root{--bg:#071321;--p:#0e2237;--c:#112a43;--ln:#28445f;--tx:#f5f8fc;--mu:#9bb0c5;--ac:#f5b942}[data-theme=light]{--bg:#eef3f8;--p:#fff;--c:#fff;--ln:#c8d5e2;--tx:#17273b;--mu:#5f748a;--ac:#c77d00}.app{max-width:1700px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:15px;align-items:center}h1{margin:0}.sub{color:var(--mu)}button,input,select,textarea{font:inherit}.btn,.field{border:1px solid var(--ln);background:var(--p);color:var(--tx);padding:10px 12px;border-radius:10px}.primary{background:var(--ac);color:#102033;border:0;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat,.lane{background:var(--p);border:1px solid var(--ln);border-radius:15px;padding:14px}.stat b{font-size:24px}.stat span{display:block;color:var(--mu)}.tools{display:grid;grid-template-columns:1fr 210px;gap:10px;margin-bottom:14px}.board{display:grid;grid-template-columns:repeat(4,minmax(270px,1fr));gap:12px;overflow:auto}.lane{min-height:600px}.lane h2{font-size:15px}.card{background:var(--c);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:9px 0;cursor:grab}.card.blocked{border-color:#e35868}.card h3{font-size:14px}.meta{color:var(--mu);font-size:11px;display:flex;justify-content:space-between}.sync{color:var(--mu);font-size:12px}.modal{display:none;position:fixed;inset:0;background:#000b;place-items:center}.modal.open{display:grid}.dialog{background:var(--p);padding:20px;border-radius:16px;width:min(580px,94%)}.grid{display:grid;gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap}.actions{display:flex;gap:8px;align-items:center}@media(max-width:900px){.board{grid-template-columns:repeat(4,280px)}.stats{grid-template-columns:1fr 1fr}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><div class="app"><header><div><h1>☀ Projeto Helios</h1><div class="sub">Painel colaborativo de execução</div></div><div class="actions"><span class="sync" id="sync">Conectando...</span><button class="btn" id="theme">Tema</button><button class="btn primary" id="new">+ Nova atividade</button></div></header><section class="stats"><div class="stat"><b id="total"></b><span>Atividades</span></div><div class="stat"><b id="open"></b><span>Em aberto</span></div><div class="stat"><b id="blocks"></b><span>Impedimentos</span></div><div class="stat"><b id="progress"></b><span>Progresso</span></div></section><section class="tools"><input class="field" id="q" placeholder="Pesquisar atividade ou responsável"><select class="field" id="person"><option value="">Toda a equipe</option></select></section><main class="board" id="board"></main></div><div class="modal" id="modal"><form class="dialog grid" id="form"><h2>Atividade do Projeto Helios</h2><input type="hidden" id="id"><input class="field" id="title" placeholder="Atividade" required><input class="field" id="owner" placeholder="Responsável" required><select class="field" id="lane"><option value="todo">A Fazer</option><option value="doing">Fazendo</option><option value="done">Finalizado</option><option value="blocked">Bloqueado</option></select><input class="field" id="due" type="date"><textarea class="field" id="blocker" placeholder="Impedimento"></textarea><div class="row"><button type="button" class="btn" id="cancel">Cancelar</button><button type="button" class="btn" id="del">Excluir</button><button class="btn primary">Salvar</button></div></form></div><script>const SEED=[{"id": "1", "title": "Alinhamento de ferramentas e horários do grupo", "owner": "Nakao", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "2", "title": "Delimitação do projeto e funcionalidades", "owner": "Grupo", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "3", "title": "Levantamento inicial das ferramentas", "owner": "Grupo", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "4", "title": "Coleta de artigos científicos", "owner": "Grupo", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "5", "title": "Estruturação das sprints e acompanhamento", "owner": "Gabriel S.", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "6", "title": "Redação da metodologia do capítulo 4", "owner": "Gabriel S.", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "7", "title": "Pesquisa sobre fadiga e segurança viária", "owner": "Pedro / Nakao / Alex", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "8", "title": "Comparativo de modelos para detecção de fadiga", "owner": "Luiz / Helbert / Igor", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "9", "title": "Pesquisa de hardware, IA, SGBD e validação", "owner": "Juan / Lucas", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "10", "title": "Análise dos artigos e critérios de validação", "owner": "Nakao", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "11", "title": "Organização do embasamento teórico", "owner": "Lucas / Juan", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "12", "title": "Definição de stacks e arquitetura", "owner": "Luiz", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "13", "title": "Preenchimento do entregável", "owner": "Gabriel S.", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "14", "title": "Revisão, impressão e encadernação", "owner": "Gabriel S.", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "15", "title": "Criação do roteiro do vídeo", "owner": "Nakao", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "16", "title": "Teste de detecção facial", "owner": "Alex", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "17", "title": "Teste de comunicação entre ambientes", "owner": "Luiz", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "18", "title": "Criação da tela e mockup", "owner": "Gabriel / Juan", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "19", "title": "Definição de requisitos e MVP", "owner": "Lucas / Helbert", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "20", "title": "Integração com IA generativa", "owner": "Pedro", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "21", "title": "Desenho do fluxo lógico", "owner": "Igor", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "22", "title": "Gravação e edição do vídeo", "owner": "Nakao", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "23", "title": "Viabilidade do ESP32", "owner": "Gabriel S.", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "24", "title": "Evolução da detecção facial", "owner": "Alex", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "25", "title": "Evolução do armazenamento", "owner": "Luiz", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "26", "title": "Estudo de caso Volkswagen", "owner": "Lucas", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "27", "title": "Destino dos alertas", "owner": "Juan", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "28", "title": "Integrações e ferramentas de saída", "owner": "Igor", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "29", "title": "KPIs de monitoramento", "owner": "Helbert", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "30", "title": "Engenharia de prompt e report", "owner": "Pedro", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "31", "title": "Compra das placas", "owner": "Gabriel S.", "lane": "done", "priority": 3, "due": "", "blocker": ""}, {"id": "32", "title": "Programar o Projeto Helios no ESP32", "owner": "Gabriel S.", "lane": "doing", "priority": 5, "due": "", "blocker": ""}, {"id": "33", "title": "Desenvolvimento do aplicativo", "owner": "Alex / Nakao", "lane": "doing", "priority": 5, "due": "", "blocker": ""}, {"id": "34", "title": "Artefatos para comunicação com imagens", "owner": "Alex / Nakao", "lane": "todo", "priority": 3, "due": "", "blocker": ""}, {"id": "35", "title": "Configuração da API", "owner": "Alex / Nakao", "lane": "todo", "priority": 3, "due": "", "blocker": ""}, {"id": "36", "title": "Análise das imagens", "owner": "Luiz / Pedro / Juan", "lane": "todo", "priority": 3, "due": "", "blocker": ""}, {"id": "37", "title": "Integração com inteligência artificial", "owner": "Helbert / Luiz", "lane": "todo", "priority": 3, "due": "", "blocker": ""}, {"id": "38", "title": "Documentação técnica", "owner": "Helbert / Luiz", "lane": "todo", "priority": 3, "due": "", "blocker": ""}, {"id": "39", "title": "Produção do banner", "owner": "Não atribuído", "lane": "todo", "priority": 3, "due": "", "blocker": ""}, {"id": "40", "title": "Imprimir o case 3D e registrar custos", "owner": "Igor", "lane": "blocked", "priority": 5, "due": "", "blocker": "Aguardando disponibilidade da impressora 3D e definição final do case."}],ROW='projeto-helios';let tasks=SEED,db=null;const $=x=>document.getElementById(x),lanes=[['todo','Próximos Passos','A Fazer'],['doing','Em Movimento','Fazendo'],['done','Missões Cumpridas','Finalizado'],['blocked','Pontos de Atenção','Bloqueado']];document.documentElement.dataset.theme=localStorage.getItem('theme')||'dark';$('theme').onclick=()=>{let n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('theme',n)};function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){let q=$('q').value.toLowerCase(),p=$('person').value,v=tasks.filter(t=>(!q||JSON.stringify(t).toLowerCase().includes(q))&&(!p||t.owner.includes(p)));$('board').innerHTML=lanes.map(l=>`<section class="lane" data-lane="${l[0]}"><h2>${l[1]} <small class="sub">${l[2]} · ${v.filter(t=>t.lane===l[0]).length}</small></h2>${v.filter(t=>t.lane===l[0]).map(t=>`<article draggable="true" data-id="${t.id}" class="card ${t.lane==='blocked'?'blocked':''}"><button data-edit="${t.id}" class="btn">•••</button><h3>${esc(t.title)}</h3>${t.blocker?`<p>⚠ ${esc(t.blocker)}</p>`:''}<div class="meta"><span>● ${esc(t.owner)}</span><span>${t.due||'Prazo a definir'}</span></div></article>`).join('')}</section>`).join('');let ps=[...new Set(tasks.flatMap(t=>t.owner.split(/\s*\/\s*/)))].sort(),sel=$('person').value;$('person').innerHTML='<option value="">Toda a equipe</option>'+ps.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');let d=tasks.filter(t=>t.lane==='done').length;$('total').textContent=tasks.length;$('open').textContent=tasks.length-d;$('blocks').textContent=tasks.filter(t=>t.lane==='blocked').length;$('progress').textContent=Math.round(d/tasks.length*100)+'%';bind()}function bind(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('.card').forEach(c=>c.ondragstart=e=>e.dataTransfer.setData('text/plain',c.dataset.id));document.querySelectorAll('.lane').forEach(l=>{l.ondragover=e=>e.preventDefault();l.ondrop=e=>{let t=tasks.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(t){t.lane=l.dataset.lane;save()}}})}async function save(){render();if(db){let r=await db.from('helios_boards').upsert({id:ROW,tasks,updated_at:new Date().toISOString()});$('sync').textContent=r.error?'Erro ao sincronizar':'Sincronizado'}}function edit(i){let t=tasks.find(x=>x.id===i);$('id').value=t.id;$('title').value=t.title;$('owner').value=t.owner;$('lane').value=t.lane;$('due').value=t.due;$('blocker').value=t.blocker;$('modal').classList.add('open')}$('new').onclick=()=>{$('form').reset();$('id').value='';$('del').style.display='none';$('modal').classList.add('open')};$('cancel').onclick=()=>$('modal').classList.remove('open');$('form').onsubmit=e=>{e.preventDefault();let o={id:$('id').value||String(Date.now()),title:$('title').value,owner:$('owner').value,lane:$('lane').value,due:$('due').value,blocker:$('blocker').value,priority:3},i=tasks.findIndex(x=>x.id===o.id);i<0?tasks.push(o):tasks[i]=o;$('modal').classList.remove('open');save()};$('del').onclick=()=>{tasks=tasks.filter(x=>x.id!==$('id').value);$('modal').classList.remove('open');save()};$('q').oninput=render;$('person').onchange=render;async function start(){let c=window.HELIOS_CONFIG||{};if(!c.supabaseUrl||c.supabaseUrl.includes('COLE_')){$('sync').textContent='Configure o Supabase';render();return}db=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);let r=await db.from('helios_boards').select('tasks').eq('id',ROW).maybeSingle();if(r.data)tasks=r.data.tasks;else await save();render();db.channel('helios-live').on('postgres_changes',{event:'*',schema:'public',table:'helios_boards',filter:'id=eq.'+ROW},p=>{if(p.new&&p.new.tasks){tasks=p.new.tasks;render();$('sync').textContent='Atualizado agora'}}).subscribe(s=>{if(s==='SUBSCRIBED')$('sync').textContent='Sincronizado em tempo real'})}start();</script></body></html>
