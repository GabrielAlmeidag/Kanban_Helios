iority": 5, "difficulty": 4, "due": "", "blocker": "Dependência técnica pendente para concluir a integração do ESP32."}, {"id": "49", "initiative": "DESENVOLVIMENTO", "title": "Documentação técnica da solução", "owner": "Helbert / Luiz", "lane": "blocked", "priority": 4, "difficulty": 3, "due": "", "blocker": "Aguardando consolidação das integrações e evidências técnicas."}],ROW_ID='projeto-helios',CACHE_KEY='helios-kanban-cache-v3';let tasks=loadCache(),db=null;const $=id=>document.getElementById(id);const LANES=[{id:'todo',title:'Próximos Passos',sub:'A Fazer',color:'#f8bd3e'},{id:'doing',title:'Em Movimento',sub:'Em Execução',color:'#41c6f4'},{id:'done',title:'Missões Cumpridas',sub:'Finalizado',color:'#3cdc8b'},{id:'blocked',title:'Pontos de Atenção',sub:'Com Impedimento',color:'#ff6178'}];
function loadCache(){try{const saved=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');return Array.isArray(saved)&&saved.length?saved:JSON.parse(JSON.stringify(SEED))}catch(e){return JSON.parse(JSON.stringify(SEED))}}function cacheTasks(){localStorage.setItem(CACHE_KEY,JSON.stringify(tasks))}function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function people(){const a=[];tasks.forEach(t=>t.owner.split(/\s*\/\s*|,| e /i).forEach(x=>{x=x.trim();if(x&&!['Grupo','Não atribuído'].includes(x)&&!a.includes(x))a.push(x)}));return a.sort()}function filtered(){const q=$('search').value.toLowerCase(),o=$('ownerFilter').value,p=$('priorityFilter').value;return tasks.filter(t=>(!q||JSON.stringify(t).toLowerCase().includes(q))&&(!o||t.owner.includes(o))&&(!p||String(t.priority)===p))}function initials(n){return n.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}function card(t){return `<article class="card ${t.lane==='blocked'?'blocked':''}" draggable="true" data-id="${esc(t.id)}"><div class="cardtop"><span class="code">#${esc(t.id)}</span><button class="more" type="button" data-edit="${esc(t.id)}">•••</button></div><div class="initiative">${esc(t.initiative)}</div><h3>${esc(t.title)}</h3><div class="chips"><span class="chip ${t.priority>=5?'hot':''}">Prioridade ${t.priority}</span><span class="chip">Esforço ${t.difficulty}</span>${t.lane==='blocked'?'<span class="chip warn">Impedimento</span>':''}</div>${t.blocker?`<p class="blocker">⚠ ${esc(t.blocker)}</p>`:''}<div class="cardfoot"><span class="owner">● ${esc(t.owner)}</span><span>◷ ${t.due?new Date(t.due+'T12:00:00').toLocaleDateString('pt-BR'):'Prazo a definir'}</span></div></article>`}function render(){const view=filtered();$('board').innerHTML=LANES.map(l=>{const cards=view.filter(t=>t.lane===l.id);return `<section class="lane" data-lane="${l.id}"><header class="lanehead"><div class="lanetitle"><span class="dot" style="background:${l.color}"></span><div><h2>${l.title}</h2><p>${l.sub}</p></div></div><span class="count">${cards.length}</span></header><div class="stack">${cards.length?cards.map(card).join(''):'<div class="empty">Nenhuma atividade nesta raia</div>'}</div></section>`}).join('');const ps=people(),sel=$('ownerFilter').value;$('ownerFilter').innerHTML='<option value="">Toda a equipe</option>'+ps.map(p=>`<option value="${esc(p)}" ${p===sel?'selected':''}>${esc(p)}</option>`).join('');$('people').innerHTML=ps.map(p=>{const n=tasks.filter(t=>t.owner.includes(p)&&t.lane!=='done').length;return `<div class="person" data-person="${esc(p)}"><div class="avatar">${initials(p)}</div><div><b>${esc(p)}</b><small>${n} atividade(s) aberta(s)</small></div></div>`}).join('');const done=tasks.filter(t=>t.lane==='done').length;$('totalKpi').textContent=tasks.length;$('openKpi').textContent=tasks.length-done;$('blockedKpi').textContent=tasks.filter(t=>t.lane==='blocked').length;$('progressKpi').textContent=Math.round(done/tasks.length*100)+'%';bind()}function bind(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('[data-person]').forEach(p=>p.onclick=()=>{$('ownerFilter').value=p.dataset.person;render()});document.querySelectorAll('.card').forEach(c=>c.ondragstart=e=>e.dataTransfer.setData('text/plain',c.dataset.id));document.querySelectorAll('.lane').forEach(l=>{l.ondragover=e=>{e.preventDefault();l.classList.add('drag')};l.ondragleave=()=>l.classList.remove('drag');l.ondrop=e=>{e.preventDefault();l.classList.remove('drag');const t=tasks.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(t){t.lane=l.dataset.lane;save('Atividade movida')}}})}function toast(m){$('toast').textContent=m;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1700)}async function save(m='Alterações salvas'){cacheTasks();render();if(db){const r=await db.from('helios_boards').upsert({id:ROW_ID,tasks,updated_at:new Date().toISOString()});if(r.error){setSync('err','Salvo neste navegador; nuvem indisponível');toast('Salvo localmente');return}setSync('ok','Sincronizado em tempo real')}toast(m)}function setSync(c,t){$('syncDot').className='syncdot '+c;$('syncText').textContent=t}function openNew(){$('taskForm').reset();$('editId').value='';$('lane').value='todo';$('priority').value=3;$('difficulty').value=3;$('deleteBtn').style.visibility='hidden';$('formTitle').textContent='Nova atividade do Projeto Helios';$('modal').classList.add('open')}function edit(id){const t=tasks.find(x=>x.id===id);if(!t)return;openNew();$('deleteBtn').style.visibility='visible';$('formTitle').textContent='Editar atividade';['title','initiative','owner','lane','due','priority','difficulty','blocker'].forEach(k=>$(k).value=t[k]??'');$('editId').value=t.id}$('newBtn').onclick=openNew;$('cancelBtn').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};$('taskForm').onsubmit=e=>{e.preventDefault();const id=$('editId').value||String(Date.now()),obj={id,title:$('title').value,initiative:$('initiative').value.toUpperCase(),owner:$('owner').value,lane:$('lane').value,due:$('due').value,priority:Number($('priority').value),difficulty:Number($('difficulty').value),blocker:$('blocker').value},i=tasks.findIndex(x=>x.id===id);i<0?tasks.push(obj):tasks[i]=obj;$('modal').classList.remove('open');save(i<0?'Atividade criada':'Atividade atualizada')};$('deleteBtn').onclick=()=>{const id=$('editId').value;if(id&&confirm('Excluir esta atividade?')){tasks=tasks.filter(x=>x.id!==id);$('modal').classList.remove('open');save('Atividade excluída')}};$('search').oninput=render;$('ownerFilter').onchange=render;$('priorityFilter').onchange=render;$('themeBtn').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('helios-theme',n)};$('exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}));a.download='projeto-helios.json';a.click()};document.documentElement.dataset.theme=localStorage.getItem('helios-theme')||'dark';async function start(){render();const cfg=window.HELIOS_CONFIG||{};if(!cfg.supabaseUrl||cfg.supabaseUrl.includes('COLE_')){setSync('err','Modo local: configure o Supabase');return}try{db=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const r=await db.from('helios_boards').select('tasks').eq('id',ROW_ID).maybeSingle();if(r.error)throw r.error;if(r.data&&Array.isArray(r.data.tasks)&&r.data.tasks.length){tasks=r.data.tasks;cacheTasks();render()}else{await save('Planejamento inicial publicado')}db.channel('helios-live').on('postgres_changes',{event:'*',schema:'public',table:'helios_boards',filter:'id=eq.'+ROW_ID},p=>{if(p.new&&Array.isArray(p.new.tasks)){tasks=p.new.tasks;cacheTasks();render();setSync('ok','Atualizado agora')}}).subscribe(status=>{if(status==='SUBSCRIBED')setSync('ok','Sincronizado em tempo real');if(status==='CHANNEL_ERROR')setSync('err','Salvo localmente; realtime indisponível')})}catch(e){setSync('err','Modo local: falha na nuvem');render()}}start();
</script></body></html>
